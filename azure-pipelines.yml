trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
# Install vsce and dependencies
- script: |
    npm install -g @vscode/vsce
    npm install
  displayName: 'Install vsce and dependencies'

# Get Managed Identity Resource ID (only needed once, can remove after)
- task: AzureCLI@2
  displayName: 'Get identity details'
  inputs:
    azureSubscription: vscode-marketplace-connection
    scriptType: pscore
    scriptLocation: inlineScript
    inlineScript: |
      az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798

# Publish extension
- task: AzureCLI@2
  displayName: 'Publish using managed identity'
  inputs:
    azureSubscription: vscode-marketplace-connection
    scriptType: pscore
    scriptLocation: inlineScript
    inlineScript: |
      vsce publish --azure-credential